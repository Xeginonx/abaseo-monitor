name: Surveillance créneaux Abaseo

on:
  schedule:
    # Toutes les 10 min, lun-sam, 8h-19h (heure Paris = UTC+2 en été)
    - cron: "*/10 6-17 * * 1-6"
  workflow_dispatch: # Lancement manuel possible

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Vérifier les créneaux
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: node check_slots.js
